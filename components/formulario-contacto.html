<section class="py-20 bg-slate-50">
    <div class="max-w-3xl mx-auto px-6">
        <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 reveal">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-slate-900 mb-4">Envíanos un Mensaje</h2>
                <p class="text-slate-600">Completa el formulario y te responderemos en menos de 24 horas</p>
            </div>

            <form class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre completo *</label>
                        <input type="text" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="Tu nombre">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Teléfono</label>
                        <input type="tel" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="Tu teléfono">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Correo electrónico *</label>
                    <input type="email" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="tu@email.com">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Motivo de consulta *</label>
                    <select required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent">
                        <option value="">Selecciona una opción</option>
                        <option value="admision">Información de Admisión</option>
                        <option value="carreras">Información de Carreras</option>
                        <option value="tramites">Trámites Administrativos</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Mensaje *</label>
                    <textarea rows="5" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="Describe tu consulta..."></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-800 text-white py-4 rounded-lg font-bold hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i>
                    Enviar Mensaje
                </button>
            </form>
        </div>
    </div>
</section>
